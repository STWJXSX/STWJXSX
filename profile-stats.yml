name: Update profile stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=STWJXSX&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=ffc87c&icon_color=ffc87c&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=STWJXSX&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=ffc87c&text_color=c9d1d9&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download streak card
        run: |
          mkdir -p profile
          curl -fsSL "https://streak-stats.demolab.com/?user=STWJXSX&theme=tokyonight&hide_border=true&background=0D1117&ring=FFC87C&fire=FFC87C&currStreakLabel=FFC87C" -o profile/streak.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats cards" || exit 0
          git push
